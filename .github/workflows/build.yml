name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build hev-socks5-tunnel native library
        run: |
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort | tail -1)"
          fi
          echo "NDK: $ANDROID_NDK_HOME"
          mkdir -p build-native/jni
          git clone --recursive --depth 1 \
            https://github.com/heiher/hev-socks5-tunnel build-native/jni
          cp native/Android.mk native/Application.mk native/tunnel_jni.c build-native/jni/
          (cd build-native && "$ANDROID_NDK_HOME/ndk-build" -j2)
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            mkdir -p app/src/main/jniLibs/$abi
            cp build-native/libs/$abi/libhev-socks5-tunnel.so app/src/main/jniLibs/$abi/
          done

      - name: Prepare signing config (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p signing
            echo "$KEYSTORE_BASE64" | base64 -d > signing/release.jks
            {
              echo "release.storeFile=$PWD/signing/release.jks"
              echo "release.storePassword=$KEYSTORE_PASSWORD"
              echo "release.keyAlias=$KEY_ALIAS"
              echo "release.keyPassword=$KEY_PASSWORD"
            } >> gradle.properties
            echo "已配置正式签名"
          else
            echo "未检测到签名 secrets，release APK 将使用 debug 签名（可直接安装）"
          fi

      - name: Build APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" || true
          gh release upload "$GITHUB_REF_NAME" \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release.apk \
            --clobber
